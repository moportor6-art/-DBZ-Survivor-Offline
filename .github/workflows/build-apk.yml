name: Compilar APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # para publicar cada versión (la busca el actualizador de la app)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      # El runner de GitHub ya trae el SDK de Android (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v5
      - name: Manifiesto del contenido (va dentro de la APK)
        run: python3 .github/scripts/manifiesto.py ${{ github.run_number }} ${{ github.sha }} app/src/main/assets/contenido-base.json
      - name: Compilar
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -Pvc=${{ github.run_number }}
      - name: Preparar la publicación
        run: |
          APK=DBSurvivors-build-${{ github.run_number }}.apk
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          python3 .github/scripts/manifiesto.py --apk "$APK" app/src/main/assets/contenido-base.json contenido.json
          git log -1 --pretty=%B > notas.md
          echo "APK=$APK" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: DBSurvivors-APK
          path: ${{ env.APK }}
      # Cada compilación de la rama del juego se publica como versión: la app la encuentra y se actualiza sola
      - name: Publicar versión
        if: github.ref == 'refs/heads/apk-coleccion'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DB Survivors · build ${{ github.run_number }}
          body_path: notas.md
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            ${{ env.APK }}
            contenido.json
